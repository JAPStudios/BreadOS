name: BreadOS build and smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build development image
        run: docker build --tag breados-ci .
      - name: Build ISO and run QEMU smoke test
        run: docker run --name breados-ci-run breados-ci
      - name: Copy build artifacts from container
        if: always()
        run: |
          mkdir -p artifacts
          docker cp breados-ci-run:/src/build/breados.iso artifacts/breados.iso || true
          docker cp breados-ci-run:/src/build/kernel.elf artifacts/kernel.elf || true
          docker rm breados-ci-run || true
      - name: Upload BreadOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breados-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
