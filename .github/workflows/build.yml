name: Build BreadOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib grub-pc-bin grub-common xorriso
      - name: Build kernel and bootable ISO
        working-directory: kermal
        run: make clean all
      - name: Verify Multiboot header
        working-directory: kermal
        run: grub-file --is-x86-multiboot build/kernel.elf
      - name: Verify ISO was created
        working-directory: kermal
        run: test -s build/breados.iso
