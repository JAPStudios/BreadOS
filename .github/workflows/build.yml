name: Build BreadOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-prototype:
    name: Build integrated kernel and run host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib grub-pc-bin grub-common xorriso
      - name: Build integrated kernel and bootable ISO
        run: make clean iso
      - name: Run host regression tests
        run: make test
      - name: Verify Multiboot header
        run: grub-file --is-x86-multiboot build/kernel.elf
      - name: Verify ISO was created
        run: test -s starter.iso

  modular-experiment:
    name: Build modular kermal experiment
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib grub-pc-bin grub-common xorriso
      - name: Build kernel and ISO
        working-directory: kermal
        run: make clean all
      - name: Verify Multiboot header
        working-directory: kermal
        run: grub-file --is-x86-multiboot build/kernel.elf
      - name: Verify ISO was created
        working-directory: kermal
        run: test -s build/breados.iso
